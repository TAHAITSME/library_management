{% extends 'base.html' %}

{% block title %}Mot de passe réinitialisé | BiblioNUM{% endblock %}

{% block content %}
<div class="container" style="margin-top: var(--s-12); margin-bottom: var(--s-20);">
    <div style="max-width: 480px; margin: 0 auto;">
        <div class="card" style="padding: var(--s-8); text-align: center;">
            <h1 style="font-family: var(--font-display); font-size: var(--text-xl); margin-bottom: var(--s-4);">Mot de passe réinitialisé</h1>
            <p style="color: var(--text-2); margin-bottom: var(--s-6);">Votre mot de passe a bien été mis à jour. Vous pouvez maintenant vous connecter.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg btn-full">Se connecter</a>
        </div>
    </div>
</div>
{% endblock %}
