{% extends 'base.html' %}

{% block title %}Modifier Mon Profil | BiblioNUM{% endblock %}

{% block content %}
<div class="container" style="margin-top: var(--s-12); margin-bottom: var(--s-20);">
    <div style="max-width: 600px; margin: 0 auto;">
        <h1 style="font-family: var(--font-display); font-size: var(--text-xl); margin-bottom: var(--s-8);">Modifier Mon Profil</h1>

        <div class="card" style="padding: var(--s-8);">
            <form method="post" novalidate style="display: flex; flex-direction: column; gap: var(--s-6);">
                {% csrf_token %}

                <div>
                    <label for="id_username" style="display: block; font-weight: 600; margin-bottom: var(--s-2);">Nom d'utilisateur</label>
                    <input type="text" name="username" id="id_username" value="{{ user.username }}" disabled style="width: 100%; padding: var(--s-3); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-raised); color: var(--text-2);">
                    <p style="color: var(--text-2); font-size: var(--text-sm); margin-top: var(--s-1);">Non modifiable</p>
                </div>

                <div>
                    <label for="id_email" style="display: block; font-weight: 600; margin-bottom: var(--s-2);">Email</label>
                    <input type="email" name="email" id="id_email" value="{{ user.email }}" style="width: 100%; padding: var(--s-3); border: 1px solid var(--border); border-radius: var(--r-md);">
                </div>

                <div>
                    <label for="id_first_name" style="display: block; font-weight: 600; margin-bottom: var(--s-2);">Prénom</label>
                    <input type="text" name="first_name" id="id_first_name" value="{{ user.first_name }}" style="width: 100%; padding: var(--s-3); border: 1px solid var(--border); border-radius: var(--r-md);">
                </div>

                <div>
                    <label for="id_last_name" style="display: block; font-weight: 600; margin-bottom: var(--s-2);">Nom</label>
                    <input type="text" name="last_name" id="id_last_name" value="{{ user.last_name }}" style="width: 100%; padding: var(--s-3); border: 1px solid var(--border); border-radius: var(--r-md);">
                </div>

                <div>
                    <label for="id_phone" style="display: block; font-weight: 600; margin-bottom: var(--s-2);">Téléphone</label>
                    <input type="tel" name="phone" id="id_phone" value="{{ user.profile.phone }}" style="width: 100%; padding: var(--s-3); border: 1px solid var(--border); border-radius: var(--r-md);">
                </div>

                <div>
                    <label for="id_address" style="display: block; font-weight: 600; margin-bottom: var(--s-2);">Adresse</label>
                    <textarea name="address" id="id_address" style="width: 100%; padding: var(--s-3); border: 1px solid var(--border); border-radius: var(--r-md); min-height: 100px;">{{ user.profile.address }}</textarea>
                </div>

                <div style="display: flex; gap: var(--s-4);">
                    <a href="{% url 'accounts:profile' %}" class="btn btn-ghost btn-lg" style="flex: 1;">Annuler</a>
                    <button type="submit" class="btn btn-primary btn-lg" style="flex: 1;">
                        <i class="fas fa-save"></i> Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
