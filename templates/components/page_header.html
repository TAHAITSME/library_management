<header class="page-header">
    <div>
        {% if eyebrow %}<p class="eyebrow">{{ eyebrow }}</p>{% endif %}
        <h1>{{ title }}</h1>
        {% if subtitle %}<p>{{ subtitle }}</p>{% endif %}
    </div>
    {% if action_url and action_label %}
        <a href="{{ action_url }}" class="btn btn-primary">{{ action_label }}</a>
    {% endif %}
</header>
