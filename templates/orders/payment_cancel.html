{% extends 'base.html' %}

{% block title %}Paiement annulé | BiblioNUM{% endblock %}

{% block content %}
<section class="form-card">
    <p class="eyebrow">Stripe</p>
    <h1>Paiement annulé</h1>
    <p>Votre commande reste en attente. Vous pouvez relancer le paiement à tout moment.</p>
    <div class="form-row-between">
        <a class="btn btn-ghost" href="{% url 'orders:order_detail' order.id %}">Voir la commande</a>
        {% if order.is_payable %}
            <a class="btn btn-primary" href="{% url 'orders:order_payment' order.id %}">Réessayer</a>
        {% endif %}
    </div>
</section>
{% endblock %}
