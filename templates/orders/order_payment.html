{% extends 'base.html' %}

{% block title %}Paiement | BiblioNUM{% endblock %}

{% block content %}
<div class="container" style="margin-top: var(--s-12); margin-bottom: var(--s-20);">
    <div style="max-width: 600px; margin: 0 auto;">
        <h1 style="font-family: var(--font-display); font-size: var(--text-xl); margin-bottom: var(--s-8);">Paiement</h1>

        <div class="card" style="padding: var(--s-8);">
            <div style="padding: var(--s-4); background: var(--surface-raised); border-radius: var(--r-md); margin-bottom: var(--s-8); text-align: center;">
                <p style="color: var(--text-2); font-size: var(--text-sm); margin-bottom: var(--s-2);">Montant à payer</p>
                <div style="font-size: var(--text-2xl); font-weight: 600; color: var(--primary);">{{ order.total_price }}.00 DH</div>
            </div>

            <form method="post" novalidate>
                {% csrf_token %}

                <h3 style="font-family: var(--font-display); font-size: var(--text-lg); margin-bottom: var(--s-4);">Méthode de Paiement</h3>

                <div style="display: flex; flex-direction: column; gap: var(--s-4); margin-bottom: var(--s-8);">
                    <label style="padding: var(--s-4); border: 2px solid var(--border); border-radius: var(--r-md); cursor: pointer; transition: all var(--t-fast);">
                        <input type="radio" name="payment_method" value="card" checked style="margin-right: var(--s-2);">
                        <strong>Carte Bancaire</strong>
                        <p style="color: var(--text-2); font-size: var(--text-sm);">Visa, Mastercard, Amex</p>
                    </label>

                    <label style="padding: var(--s-4); border: 2px solid var(--border); border-radius: var(--r-md); cursor: pointer; transition: all var(--t-fast);">
                        <input type="radio" name="payment_method" value="paypal" style="margin-right: var(--s-2);">
                        <strong>PayPal</strong>
                        <p style="color: var(--text-2); font-size: var(--text-sm);">Paiement sécurisé via PayPal</p>
                    </label>

                    <label style="padding: var(--s-4); border: 2px solid var(--border); border-radius: var(--r-md); cursor: pointer; transition: all var(--t-fast);">
                        <input type="radio" name="payment_method" value="bank" style="margin-right: var(--s-2);">
                        <strong>Virement Bancaire</strong>
                        <p style="color: var(--text-2); font-size: var(--text-sm);">Paiement par virement</p>
                    </label>
                </div>

                <div style="display: flex; gap: var(--s-4);">
                    <a href="{% url 'orders:create_order' %}" class="btn btn-ghost btn-lg" style="flex: 1;">Retour</a>
                    <button type="submit" class="btn btn-primary btn-lg" style="flex: 1;">
                        <i class="fas fa-lock"></i> Payer de Manière Sécurisée
                    </button>
                </div>

                <p style="text-align: center; color: var(--text-2); font-size: var(--text-sm); margin-top: var(--s-6);">
                    <i class="fas fa-shield"></i> Vos données de paiement sont sécurisées par SSL
                </p>
            </form>
        </div>
    </div>
</div>
{% endblock %}
