{% extends 'base.html' %}

{% block title %}Annuler la reservation | BiblioNUM{% endblock %}

{% block content %}
<section class="form-card">
    <p class="eyebrow">Confirmation</p>
    <h1>Annuler cette reservation ?</h1>
    <p>{{ reservation.book.title }} par {{ reservation.book.author }}</p>
    <form method="post" class="form-row-between">
        {% csrf_token %}
        <a href="{% url 'reservations:detail' reservation.pk %}" class="btn btn-ghost">Garder</a>
        <button type="submit" class="btn btn-danger">Annuler la reservation</button>
    </form>
</section>
{% endblock %}
