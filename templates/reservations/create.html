{% extends 'base.html' %}

{% block title %}Nouvelle Réservation | BiblioNUM{% endblock %}

{% block content %}
<div class="container" style="margin-top: var(--s-12); margin-bottom: var(--s-20);">
    <div style="max-width: 600px; margin: 0 auto;">
        <h1 style="font-family: var(--font-display); font-size: var(--text-xl); margin-bottom: var(--s-8);">Réserver un Livre</h1>

        <div class="card" style="padding: var(--s-8);">
            <form method="post" novalidate>
                {% csrf_token %}

                <div style="padding: var(--s-4); background: var(--surface-raised); border-radius: var(--r-md); margin-bottom: var(--s-6);">
                    <p style="color: var(--text-2); font-size: var(--text-sm);">Vous êtes sur le point de réserver</p>
                    <h3 style="font-family: var(--font-display); font-size: var(--text-lg);">{{ book.title }}</h3>
                    <p style="color: var(--text-2);">{{ book.author }}</p>
                </div>

                <div class="form-group" style="margin-bottom: var(--s-6);">
                    <label style="display: block; font-weight: 600; margin-bottom: var(--s-2);">Preference de notification</label>
                    <select name="notification_type" required style="width: 100%; padding: var(--s-3); border: 1px solid var(--border); border-radius: var(--r-md);">
                        <option value="email">Email</option>
                        <option value="sms">SMS</option>
                        <option value="both">Email et SMS</option>
                    </select>
                </div>

                <div style="display: flex; gap: var(--s-4);">
                    <a href="{% url 'catalog:book_detail' book.id %}" class="btn btn-ghost btn-lg" style="flex: 1;">Annuler</a>
                    <button type="submit" class="btn btn-primary btn-lg" style="flex: 1;">
                        <i class="fas fa-bookmark"></i> Confirmer la Réservation
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
