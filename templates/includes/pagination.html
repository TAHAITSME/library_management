{% if is_paginated %}
    <nav class="pagination" aria-label="Pagination">
        {% if page_obj.has_previous %}
            <a href="?page={{ page_obj.previous_page_number }}{% if current_params %}&{{ current_params }}{% endif %}" class="pagination__item">
                <i class="fas fa-chevron-left"></i>
            </a>
        {% endif %}
        <span class="pagination__current">Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
        {% if page_obj.has_next %}
            <a href="?page={{ page_obj.next_page_number }}{% if current_params %}&{{ current_params }}{% endif %}" class="pagination__item">
                <i class="fas fa-chevron-right"></i>
            </a>
        {% endif %}
    </nav>
{% endif %}
